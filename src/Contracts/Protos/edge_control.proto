syntax = "proto3";

package conexaotopdata.edge.v1;

option csharp_namespace = "Contracts.Edge.V1";

import "google/protobuf/timestamp.proto";

// Contrato entre o aplicativo de operação e o serviço local.
//
// Regra que o contrato carrega por construção: NÃO existe campo para o número de
// cartão em texto claro. A interface gráfica nunca precisa dele — ela mostra a pessoa,
// o portão e o motivo. Um contrato sem o campo é mais forte que uma convenção de não
// preenchê-lo. Ver docs/ADR/ADR-0008 e docs/ADR/ADR-0014.
//
// Versionamento: números de campo nunca são reaproveitados. Campo removido vira
// 'reserved', e um teste de contrato confere isso.
service EdgeControl {
  // Estado geral do serviço, para o painel.
  rpc ObterEstado(ObterEstadoRequest) returns (ObterEstadoResponse);

  // Equipamentos e sua saúde.
  rpc ListarEquipamentos(ListarEquipamentosRequest) returns (ListarEquipamentosResponse);

  // Fluxo de eventos ao vivo. A interface nunca faz polling.
  rpc AcompanharEventos(AcompanharEventosRequest) returns (stream EventoDeAcesso);

  // Telas do operador. Tudo o que volta com código vem mascarado.
  rpc ListarAcessos(ListarAcessosRequest) returns (ListarAcessosResponse);
  rpc ObterConfiguracao(ObterConfiguracaoRequest) returns (ConfiguracaoDoEvento);
  rpc GravarConfiguracao(GravarConfiguracaoRequest) returns (GravarConfiguracaoResponse);
  rpc ObterSincronizacao(ObterSincronizacaoRequest) returns (SituacaoDaSincronizacao);
  rpc ObterPrestacaoDeContas(ObterPrestacaoDeContasRequest) returns (PrestacaoDeContas);
  rpc ConsultarCodigo(ConsultarCodigoRequest) returns (ConsultarCodigoResponse);
  rpc ObterDiagnostico(ObterDiagnosticoRequest) returns (Diagnostico);
}

message ObterEstadoRequest {}

message ObterEstadoResponse {
  string versao = 1;
  int32 workers_ativos = 2;
  int32 equipamentos_conectados = 3;
  int64 outbox_pendente = 4;

  // Idade do item mais antigo ainda não sincronizado. É o sinal de que a
  // sincronização parou — e não de que a internet caiu.
  int64 outbox_idade_mais_antigo_segundos = 5;

  // Nível de degradação em que a operação está. Ver ADR-0017.
  NivelDeDegradacao nivel = 6;

  bool internet_disponivel = 7;

  // Contagens do evento, lidas da base local (ADR-0024).
  int64 liberados = 8;
  int64 negados = 9;
  int64 giros = 10;
  int64 liberados_ultimos_5_minutos = 11;
  int64 cartas_mortas = 12;
  int32 equipamentos_cadastrados = 13;

  // Quando a nuvem respondeu com sucesso pela última vez; vazio se nunca.
  google.protobuf.Timestamp ultima_sincronizacao = 14;

  // Verdadeiro quando o serviço subiu sem arquivo de configuração: falta rodar o
  // assistente de configuração. Falso (o padrão) em serviço configurado ou antigo.
  bool sem_configuracao = 15;
}

message ListarEquipamentosRequest {}

message ListarEquipamentosResponse {
  repeated Equipamento equipamentos = 1;
}

message Equipamento {
  int32 inner = 1;
  string nome_do_gate = 2;
  string worker = 3;
  int32 porta = 4;
  string estado = 5;
  bool saudavel = 6;
  google.protobuf.Timestamp ultimo_evento = 7;
  string firmware = 8;
  bool homologado = 9;

  // Preenchido só em equipamento com urna.
  int32 capacidade_da_urna_usada_por_cento = 10;

  // Em operação: atendendo público. Falso também quando o worker parou de dar notícia.
  bool em_operacao = 11;
  int32 tentativas_de_reconexao = 12;
  // "liberado" ou "negado"; vazio se ainda não decidiu nada.
  string ultima_decisao = 13;
  // Quando o worker deu notícia desta catraca pela última vez.
  google.protobuf.Timestamp noticia_em = 14;
}

message AcompanharEventosRequest {
  // Vazio acompanha todos.
  repeated int32 inners = 1;
}

message EventoDeAcesso {
  string evento_id = 1;
  int32 inner = 2;
  google.protobuf.Timestamp recebido_em = 3;

  int32 origem_bruta = 4;
  string origem_conhecida = 5;
  bool origem_desconhecida = 6;

  // Credencial SEMPRE mascarada. Não existe campo para o valor real.
  string credencial_mascarada = 7;

  string pessoa = 8;
  ResultadoDoAcesso resultado = 9;
  string motivo = 10;
  string mensagem_ao_operador = 11;

  // Verdadeiro só com prova física de giro (origem 6). Ver ADR-0007.
  bool passagem_confirmada = 12;

  string correlation_id = 13;

  // Categoria do ingresso no instante da tentativa (meia, inteira, social...).
  string categoria = 14;
  string portao = 15;
}

enum ResultadoDoAcesso {
  RESULTADO_DO_ACESSO_NAO_ESPECIFICADO = 0;
  RESULTADO_DO_ACESSO_PERMITIDO = 1;
  RESULTADO_DO_ACESSO_NEGADO = 2;
  RESULTADO_DO_ACESSO_EM_REVISAO = 3;
  RESULTADO_DO_ACESSO_CONTINGENCIA = 4;
}

enum NivelDeDegradacao {
  NIVEL_DE_DEGRADACAO_NAO_ESPECIFICADO = 0;
  NIVEL_DE_DEGRADACAO_T0_NORMAL = 1;
  NIVEL_DE_DEGRADACAO_T1_SEM_INTERNET = 2;
  NIVEL_DE_DEGRADACAO_T2_LISTA_LOCAL = 3;
  NIVEL_DE_DEGRADACAO_T3_ISOLADO = 4;
}

enum FiltroDeResultado {
  FILTRO_DE_RESULTADO_NAO_ESPECIFICADO = 0;  // todos
  FILTRO_DE_RESULTADO_LIBERADOS = 1;
  FILTRO_DE_RESULTADO_NEGADOS = 2;
}

message ListarAcessosRequest {
  int32 inner = 1;                         // 0 = todas as catracas
  FiltroDeResultado resultado = 2;
  google.protobuf.Timestamp desde = 3;
  google.protobuf.Timestamp ate = 4;
  int32 limite = 5;                        // 0 = padrão do serviço
  string categoria = 6;                    // vazio = todas
}

message ListarAcessosResponse {
  repeated EventoDeAcesso acessos = 1;     // do mais recente ao mais antigo
  bool ha_mais = 2;
}

message ObterConfiguracaoRequest {}

message ConfiguracaoDoEvento {
  int32 tipo_de_leitor = 1;
  bool leitor_da_urna = 2;
  int32 tempo_de_acionamento_segundos = 3;
  string mensagem_padrao = 4;
  bool nuvem_ligada = 5;                   // só leitura: vem da instalação
  int32 espera_pelo_giro_segundos = 6;
}

message GravarConfiguracaoRequest {
  ConfiguracaoDoEvento configuracao = 1;
  string operador = 2;
}

message GravarConfiguracaoResponse {
  bool gravada = 1;
  repeated string problemas = 2;
  // As catracas leem a configuração ao conectar: vale depois que o serviço reiniciar.
  bool exige_reinicio = 3;
}

message ObterSincronizacaoRequest {}

message SituacaoDaSincronizacao {
  bool configurada = 1;
  google.protobuf.Timestamp ultimo_sucesso = 2;
  string ultima_falha = 3;
  int64 pendentes = 4;
  int64 idade_do_mais_antigo_segundos = 5;
  int64 cartas_mortas = 6;
  repeated ProvedorCadastrado provedores = 7;
}

message ProvedorCadastrado {
  string id = 1;
  string nome = 2;
  int64 codigos = 3;
  bool reutilizavel = 4;
  int32 intervalo_de_reuso_segundos = 5;
  bool somente_na_urna = 6;
  bool habilitado = 7;
}

message ObterPrestacaoDeContasRequest {
  google.protobuf.Timestamp desde = 1;
  google.protobuf.Timestamp ate = 2;
}

message PrestacaoDeContas {
  repeated LinhaPorCategoria por_categoria = 1;
  repeated LinhaPorCatraca por_catraca = 2;
  repeated LinhaPorHora por_hora = 3;
  repeated LinhaDeNegativa negativas = 4;
  int64 liberados = 5;
  int64 giros = 6;
  int64 negados = 7;
  google.protobuf.Timestamp gerada_em = 8;
}

message LinhaPorCategoria {
  string categoria = 1;
  int64 liberados = 2;
  int64 giros = 3;
}

message LinhaPorCatraca {
  int32 inner = 1;
  int64 liberados = 2;
  int64 giros = 3;
  int64 negados = 4;
}

message LinhaPorHora {
  google.protobuf.Timestamp hora = 1;
  int64 liberados = 2;
  int64 negados = 3;
}

message LinhaDeNegativa {
  string motivo = 1;
  string mensagem = 2;
  int64 quantidade = 3;
}

// O operador digita o código para consultar; a resposta nunca o devolve inteiro.
message ConsultarCodigoRequest {
  string codigo = 1;
}

message ConsultarCodigoResponse {
  bool encontrado = 1;
  string codigo_mascarado = 2;
  string provedor = 3;
  string categoria = 4;
  string situacao = 5;
  int64 usos_feitos = 6;
  int64 usos_maximos = 7;                  // 0 = sem limite
  google.protobuf.Timestamp ultimo_uso = 8;
  repeated EventoDeAcesso historico = 9;   // do mais recente ao mais antigo
}

message ObterDiagnosticoRequest {}

message Diagnostico {
  string versao = 1;
  string pasta_de_dados = 2;
  repeated DiagnosticoDeWorker workers = 3;
}

message DiagnosticoDeWorker {
  string nome = 1;
  string situacao = 2;
  string detalhe = 3;
  int32 reinicios = 4;
  repeated string ultimas_linhas = 5;
}
