name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soak_minutos:
        description: "Duração do ensaio de soak, em minutos (o padrão da CI é curto)"
        required: false
        default: "60"

permissions:
  contents: read

# Um push novo cancela a execução anterior do mesmo ramo. Sem isso, um job pendurado
# ocupa o executor até o teto de 6 h do GitHub — foi exatamente o que aconteceu quando a
# conexão por named pipe esperava para sempre.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  # O domínio, as regras de acesso e a máquina de estados não dependem de Windows.
  # Rodar em Linux não é conveniência: é o que mantém a separação honesta.
  # Ver docs/ADR/ADR-0001-isolar-easyinner-em-processo-x86.md
  linux:
    name: Build e testes (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Testar
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-linux
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # Windows é onde o produto roda de verdade. Os projetos que só compilam lá
  # (worker x86, WPF) entram nesta matriz conforme forem criados.
  windows:
    name: Build e testes (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Testar
        run: dotnet test --no-build --configuration Release

      # Só o PowerShell do Windows sabe dizer se estes scripts sequer analisam.
      # Sem esta etapa, um erro de sintaxe no instalador só apareceria na bancada.
      # NAO tente capturar as telas aqui. Foi tentado duas vezes, 24 min e 3 min, e o
      # processo travou sem imprimir uma linha sequer nas duas. O runner do Windows nao tem
      # sessao grafica, e o WPF nao inicializa. O modo --capturar do Desktop.App continua
      # valendo, numa maquina Windows de verdade: ver installer/README.md.

      - name: Analisar os scripts do instalador
        shell: pwsh
        run: |
          $erros = @()
          Get-ChildItem installer -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $problemas = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$tokens, [ref]$problemas) | Out-Null
              if ($problemas.Count -gt 0) {
                  $erros += $problemas | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
              } else {
                  Write-Host "ok $($_.Name)"
              }
          }
          if ($erros.Count -gt 0) {
              $erros | ForEach-Object { Write-Host "::error::$_" }
              exit 1
          }

  # O instalador MSI de verdade. Construir MSI e trabalho sem tela, ao contrario de
  # renderizar WPF, entao o runner do Windows da conta. O WiX recusa rodar em Linux:
  # testado, ele reprova ate o caso minimo com WIX0389.
  instalador:
    name: Instalador MSI (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Instalar o WiX
        run: dotnet tool install --global wix --version 6.0.2

      - name: Publicar os tres componentes
        shell: pwsh
        run: |
          dotnet publish src/Edge.Supervisor -c Release -r win-x64 --self-contained false -o publicado/Servico
          dotnet publish src/Desktop.App     -c Release -r win-x64 --self-contained false -o publicado/Painel
          dotnet publish src/Edge.Worker.X86 -c Release -r win-x86 --self-contained false -o publicado/Worker

      # O worker precisa sair em 32 bits ou nao carrega a EasyInner.dll. Conferir aqui,
      # no cabecalho PE, e mais barato que descobrir na bancada.
      - name: Conferir que o worker e de 32 bits
        shell: pwsh
        run: |
          $fluxo = [System.IO.File]::OpenRead("publicado/Worker/Edge.Worker.X86.exe")
          try {
              $leitor = New-Object System.IO.BinaryReader($fluxo)
              $fluxo.Position = 0x3C
              $inicio = $leitor.ReadInt32()
              $fluxo.Position = $inicio + 4
              $maquina = $leitor.ReadUInt16()
          } finally { $fluxo.Dispose() }

          if ($maquina -ne 0x014C) {
              throw "O worker saiu com maquina PE 0x{0:X4}, e nao 0x014C (I386)." -f $maquina
          }
          Write-Host "Worker em 32 bits: ok"

      - name: Construir o MSI
        shell: pwsh
        run: |
          $versao = "0.1.$env:GITHUB_RUN_NUMBER"
          wix build installer/wix/ConexaoTopdata.wxs `
            -d Versao=$versao `
            -d PastaSupervisor=publicado/Servico `
            -d PastaPainel=publicado/Painel `
            -d PastaWorker=publicado/Worker `
            -o ConexaoTopdata-$versao.msi

      - name: Publicar o instalador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instalador-msi
          path: "*.msi"
          if-no-files-found: error

  # O soak roda curto em todo commit, o suficiente para processar centenas de milhares
  # de eventos e revelar vazamento de poucos bytes por evento. O ensaio longo, de uma
  # hora, é disparado à mão em "Run workflow" com soak_minutos.
  soak:
    name: Ensaio de soak
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Executar soak
        env:
          SOAK_MINUTOS: ${{ inputs.soak_minutos }}
        run: dotnet test tests/LoadAndSoak --configuration Release

      # A medição sai mesmo quando o ensaio passa. É a tendência entre execuções que
      # revela vazamento lento; "passou" não distingue 2 MB de 31 MB.
      - name: Publicar a medição
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medicao-do-soak
          path: "**/TestResults/soak-relatorio.txt"
          if-no-files-found: warn

  # SEC-LOG-01: nenhum dado sensível pode chegar ao log.
  # Nesta fase, a checagem é estática; ela cresce junto com a observabilidade.
  seguranca:
    name: Varredura de dado sensível
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Proibir interpolação direta de credencial em log
        run: |
          set -euo pipefail
          # Procura chamadas de log que interpolem .Raw ou .Normalized de uma credencial.
          if grep -rnE '(Log|log)[A-Za-z]*\(.*\.(Raw|Normalized)' src/ tests/ 2>/dev/null; then
            echo "::error::Credencial em texto claro dentro de chamada de log."
            exit 1
          fi
          echo "Nenhuma interpolação de credencial em log encontrada."
