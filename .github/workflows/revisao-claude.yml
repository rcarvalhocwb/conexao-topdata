name: Revisão do Claude

# Revisa todo PR contra a issue que ele fecha e as regras do CONTRIBUTING.md, comenta no PR e
# REPROVA o check quando o PR foge do plano. Com a proteção da main exigindo este check, nada
# entra sem a revisão (CONTRIBUTING.md, "Para o dono do repositório").
#
# Precisa do segredo ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions). Sem ele o
# check falha de propósito: a trava não pode sumir em silêncio.
#
# Roda em pull_request (e não em pull_request_target): PR de fork não recebe o segredo, e o
# código do PR nunca roda com permissão de escrita. Mudança neste arquivo ou no CODEOWNERS
# passa obrigatoriamente pela aprovação do dono (CODEOWNERS).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: revisao-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revisao:
    name: Revisão do Claude
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Conferir o segredo
        env:
          CHAVE: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CHAVE" ]; then
            echo "::error::Falta o segredo ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions). Sem ele não há revisão, e o PR não pode entrar."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revisar
        id: revisar
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            Você é o revisor que valida este PR antes de ele entrar na main. Escreva em português.

            1. Leia CONTRIBUTING.md (as regras valem como lei) e a issue que o PR fecha ("Fecha #N" na
               descrição; leia com gh issue view). Sem issue ligada, o PR está reprovado.
            2. Leia o diff inteiro (gh pr diff) e o código em volta do que mudou.
            3. Reprove quando houver qualquer um destes:
               - mudança fora da área da issue sem justificativa no PR, ou que desfaz/sobrepõe trabalho
                 de outra tarefa;
               - defeito de correção, de segurança ou de concorrência que você consiga apontar com um
                 cenário concreto;
               - comportamento novo sem teste, ou teste enfraquecido, pulado ou apagado para passar;
               - SDK da Topdata (EasyInner*.dll), segredo, token ou dado pessoal real no repositório;
               - migração que muda uma migração já existente, ou número de migração repetido;
               - texto de tela ou mensagem ao operador fora do português, ou informação falsa na
                 documentação.
            4. Não reprove por gosto de estilo: o que for só sugestão, comente como sugestão.
            5. Comente cada problema na linha (comentário inline) e deixe um comentário geral no PR
               com o veredito e a lista do que falta.

            Responda no formato pedido: veredito "aprovado" ou "reprovado", e os motivos.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"veredito":{"type":"string","enum":["aprovado","reprovado"]},"motivos":{"type":"array","items":{"type":"string"}}},"required":["veredito","motivos"]}'

      - name: Aplicar o veredito
        env:
          SAIDA: ${{ steps.revisar.outputs.structured_output }}
        run: |
          veredito=$(echo "$SAIDA" | jq -r '.veredito // empty')
          echo "$SAIDA" | jq -r '.motivos[]? | "- " + .'
          if [ "$veredito" != "aprovado" ]; then
            echo "::error::Revisão: ${veredito:-sem veredito}. Veja os comentários no PR."
            exit 1
          fi
          echo "Revisão aprovada."
